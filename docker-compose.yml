version: "3.4"

services:
  database:
    image: postgres:16
    container_name: symfony_db
    restart: always
    environment:
      POSTGRES_DB: symfony_db
      POSTGRES_USER: symfony_user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: symfony_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:

